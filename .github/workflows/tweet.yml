name: Post DevOps Tweet rajaji2 - 6 tweets per day

on:
  schedule:
    # IST = UTC + 5:30  |  so IST 8:00am  = UTC 2:30am
    - cron: '30 2  * * *'   # Slot 0 — 08:00 IST  Project Post      (PEAK)
    - cron: '30 6  * * *'   # Slot 1 — 12:00 IST  Poll              (lunch)
    - cron: '30 8  * * *'   # Slot 2 — 14:00 IST  Relatable Meme    (post-lunch)
    - cron: '30 11 * * *'   # Slot 3 — 17:00 IST  Career Tip        (end of day)
    - cron: '30 13 * * *'   # Slot 4 — 19:00 IST  Motivational      (PEAK)
    - cron: '0  16 * * *'   # Slot 5 — 21:30 IST  Community Question

  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot (0=Project 1=Poll 2=Meme 3=Career 4=Motivational 5=Question)'
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

jobs:
  tweet:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tweepy

      - name: Determine slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TWEET_SLOT=${{ github.event.inputs.slot }}" >> $GITHUB_ENV
          else
            # Match by hour AND minute to avoid slot collisions
            HOUR=$(date -u +%H | sed 's/^0//')
            MIN=$(date -u +%M)
            if   [ "$HOUR" = "2"  ] && [ "$MIN" = "30" ]; then echo "TWEET_SLOT=0" >> $GITHUB_ENV
            elif [ "$HOUR" = "6"  ] && [ "$MIN" = "30" ]; then echo "TWEET_SLOT=1" >> $GITHUB_ENV
            elif [ "$HOUR" = "8"  ] && [ "$MIN" = "30" ]; then echo "TWEET_SLOT=2" >> $GITHUB_ENV
            elif [ "$HOUR" = "11" ] && [ "$MIN" = "30" ]; then echo "TWEET_SLOT=3" >> $GITHUB_ENV
            elif [ "$HOUR" = "13" ] && [ "$MIN" = "30" ]; then echo "TWEET_SLOT=4" >> $GITHUB_ENV
            elif [ "$HOUR" = "16" ] && [ "$MIN" = "0"  ]; then echo "TWEET_SLOT=5" >> $GITHUB_ENV
            else echo "TWEET_SLOT=0" >> $GITHUB_ENV
            fi
          fi

      - name: Generate and Post Tweet
        env:
          X_API_KEY:        ${{ secrets.X_API_KEY }}
          X_API_SECRET:     ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:   ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:  ${{ secrets.X_ACCESS_SECRET }}
          CLAUDE_API_KEY:   ${{ secrets.CLAUDE_API_KEY }}
          TWEET_SLOT:       ${{ env.TWEET_SLOT }}
        run: python post_tweet.py
