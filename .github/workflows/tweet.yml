name: Post DevOps Tweet rajaji2 - 6 tweets per day

on:
  schedule:
    - cron: '0 2  * * *'   # Slot 0 — 07:30 IST  Project Post
    - cron: '0 5  * * *'   # Slot 1 — 10:30 IST  Poll
    - cron: '0 8  * * *'   # Slot 2 — 13:30 IST  Relatable Meme
    - cron: '0 11 * * *'   # Slot 3 — 16:30 IST  Career Tip
    - cron: '0 14 * * *'   # Slot 4 — 19:30 IST  Motivational
    - cron: '0 16 * * *'   # Slot 5 — 21:30 IST  Community Question

  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to post (0=Project, 1=Poll, 2=Meme, 3=Career, 4=Motivational, 5=Question)'
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

jobs:
  tweet:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tweepy

      - name: Determine slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TWEET_SLOT=${{ github.event.inputs.slot }}" >> $GITHUB_ENV
          else
            HOUR=$(date -u +%H | sed 's/^0//')
            case $HOUR in
              2)  echo "TWEET_SLOT=0" >> $GITHUB_ENV ;;
              5)  echo "TWEET_SLOT=1" >> $GITHUB_ENV ;;
              8)  echo "TWEET_SLOT=2" >> $GITHUB_ENV ;;
              11) echo "TWEET_SLOT=3" >> $GITHUB_ENV ;;
              14) echo "TWEET_SLOT=4" >> $GITHUB_ENV ;;
              16) echo "TWEET_SLOT=5" >> $GITHUB_ENV ;;
              *)  echo "TWEET_SLOT=0" >> $GITHUB_ENV ;;
            esac
          fi

      - name: Generate and Post Tweet
        env:
          X_API_KEY:        ${{ secrets.X_API_KEY }}
          X_API_SECRET:     ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:   ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:  ${{ secrets.X_ACCESS_SECRET }}
          CLAUDE_API_KEY:   ${{ secrets.CLAUDE_API_KEY }}
          TWEET_SLOT:       ${{ env.TWEET_SLOT }}
        run: python post_tweet.py
