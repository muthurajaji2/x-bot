name: 🐦 Post DevOps Tweet (@rajaji2)

on:
  schedule:
    - cron: '30 2 * * *'   # Slot 0 — 08:00 IST  (Project Post)
    - cron: '30 5 * * *'   # Slot 1 — 11:00 IST  (DevOps Tip)
    - cron: '30 8 * * *'   # Slot 2 — 14:00 IST  (Hot Take)
    - cron: '30 11 * * *'  # Slot 3 — 17:00 IST  (Poll / Question)
    - cron: '30 15 * * *'  # Slot 4 — 21:00 IST  (Relatable Meme)

  workflow_dispatch:
    inputs:
      slot:
        description: 'Tweet slot (0=Project, 1=Tip, 2=HotTake, 3=Poll, 4=Meme)'
        required: true
        default: '0'
        type: choice
        options: ['0', '1', '2', '3', '4']

jobs:
  tweet:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install tweepy

      - name: 🧮 Determine slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TWEET_SLOT=${{ github.event.inputs.slot }}" >> $GITHUB_ENV
          else
            HOUR=$(date -u +%H)
            case $HOUR in
              02) echo "TWEET_SLOT=0" >> $GITHUB_ENV ;;
              05) echo "TWEET_SLOT=1" >> $GITHUB_ENV ;;
              08) echo "TWEET_SLOT=2" >> $GITHUB_ENV ;;
              11) echo "TWEET_SLOT=3" >> $GITHUB_ENV ;;
              *)  echo "TWEET_SLOT=4" >> $GITHUB_ENV ;;
            esac
          fi

      - name: 🤖 Generate & Post
        env:
          X_API_KEY:       ${{ secrets.X_API_KEY }}
          X_API_SECRET:    ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:  ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
          TWEET_SLOT:      ${{ env.TWEET_SLOT }}
        run: python post_tweet.py
