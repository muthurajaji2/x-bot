name: Post DevOps Tweet rajaji2 - 2 tweets per day

on:
  schedule:
    - cron: '30 4 * * *'    # Slot 0 — 10:00 AM IST  DevOps Article
    - cron: '30 12 * * *'   # Slot 1 — 06:00 PM IST  CI/CD Content

  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to post (0=DevOps Article, 1=CICD Content)'
        required: true
        default: '0'
        type: choice
        options: ['0', '1']

jobs:

  devops-article:
    name: Slot 0 - DevOps Article (10:00 AM IST)
    if: github.event_name == 'schedule' && github.event.schedule == '30 4 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install tweepy
      - name: Post DevOps Article Tweet
        env:
          X_API_KEY:       ${{ secrets.X_API_KEY }}
          X_API_SECRET:    ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:  ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          CLAUDE_API_KEY:  ${{ secrets.CLAUDE_API_KEY }}
          TWEET_SLOT:      "0"
        run: python post_tweet.py

  cicd-content:
    name: Slot 1 - CI/CD Content (06:00 PM IST)
    if: github.event_name == 'schedule' && github.event.schedule == '30 12 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install tweepy
      - name: Post CICD Content Tweet
        env:
          X_API_KEY:       ${{ secrets.X_API_KEY }}
          X_API_SECRET:    ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:  ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          CLAUDE_API_KEY:  ${{ secrets.CLAUDE_API_KEY }}
          TWEET_SLOT:      "1"
        run: python post_tweet.py

  manual:
    name: Manual trigger
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install tweepy
      - name: Post Tweet
        env:
          X_API_KEY:       ${{ secrets.X_API_KEY }}
          X_API_SECRET:    ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:  ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          CLAUDE_API_KEY:  ${{ secrets.CLAUDE_API_KEY }}
          TWEET_SLOT:      ${{ github.event.inputs.slot }}
        run: python post_tweet.py
